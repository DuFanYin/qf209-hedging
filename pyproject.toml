[project]
name = "hedging"
version = "0.1.0"
description = "QF209 A5: how textbook replication degrades under discrete, costly, misspecified hedging"
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "torch==2.14.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "jupyterlab==4.6.4", "ipykernel==7.4.0", "nbconvert==7.17.2", "nbformat==5.11.1", "pyarrow==26.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "2026-10-12"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
